# Configuración mínima para Supabase CLI.
# Crear proyecto en supabase.com y vincular: supabase link --project-ref YOUR_PROJECT_REF

[project]
id = "YOUR_PROJECT_REF"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323
